title: WerFault LSASS Process Memory Dump
id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
status: test
description: Detects WerFault creating a dump file with a name that indicates that the dump file could be an LSASS process memory, which contains user credentials
references:
    - https://github.com/helpsystems/nanodump
author: Florian Roth (Nextron Systems)
date: 2022-06-27
modified: 2026-11-08
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
    # aeng: the disk names no process; a dump file named after lsass is the indicator
        TargetFilename|contains:
            - '\lsass'
            - 'lsass.exe'
        TargetFilename|endswith:
            - '.dmp'
            - '.hdmp'
            - '.mdmp'
    condition: selection
falsepositives:
    - Unknown
level: high
